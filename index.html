<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCP · Sistema de Contas a Pagar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'%3E%3Ctext y='8.5' font-size='9'%3E💳%3C/text%3E%3C/svg%3E">
<style>
:root{--navy:#10243a;--head:#10243a;--teal:#168b83;--ink:#1d2b3a;--muted:#6b7887;--line:#e5eaf0;--bg:#f3f6fa;--card:#fff;--th:#f8fafc;--red:#b43b3b;--pill:#eaf4f3;--pillt:#176b67;--warn:#fff7e6;--warnt:#76520d;--ok:#e5f5ed;--okt:#17633f;--err:#fdecec;--errt:#9d2929;--code:#f4f6f8;--lk:#087e79;--sec:#edf1f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--head:#cfe3f5;--ink:#e6edf5;--muted:#93a3b5;--line:#263444;--bg:#0e151d;--card:#16202b;--th:#1b2733;--red:#ee8a8a;--pill:#1d3b3a;--pillt:#8ce0d7;--warn:#33290f;--warnt:#f0cf85;--ok:#16301f;--okt:#8fdcae;--err:#3a1b1b;--errt:#f2a0a0;--code:#1b2733;--lk:#6fd6cc;--sec:#243241;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif}
header{background:#10243a;color:#fff;padding:14px max(20px,calc((100% - 1180px)/2));display:flex;align-items:center;gap:24px;min-height:70px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:170px}.mark{background:var(--teal);border-radius:12px;padding:8px 13px;font-size:22px;font-weight:800}.brand b{display:block;font-size:19px;letter-spacing:1px}.brand small,.user small{display:block;color:#c4d1df;font-size:11px}
nav{display:flex;gap:18px;flex:1;flex-wrap:wrap}nav a{color:#eaf1f7;font-size:13px;cursor:pointer;font-weight:500}.user{font-size:12px;text-align:right}.linkbtn{background:none;border:0;color:#8ce0d7;padding:0;cursor:pointer;font-size:12px}
main{max-width:1180px;margin:30px auto;padding:0 18px;min-height:70vh}footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin:8px 0 22px;gap:16px}.eyebrow{font-size:10px;letter-spacing:1.7px;color:var(--teal);font-weight:800}
h1{font-size:28px;margin:4px 0;color:var(--head)}h2{font-size:17px;margin:0 0 14px;color:var(--head)}p{margin:8px 0}.muted{color:var(--muted)}
.card,.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{margin:0;padding:16px}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:26px;color:var(--head);margin-top:4px}.stat.w strong,.overdue{color:var(--red)}.stat.s strong{color:#b8801a}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;background:var(--th)}td,th{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td small{display:block;color:var(--muted);white-space:normal}
a{color:var(--lk);font-weight:600;cursor:pointer;text-decoration:none}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:var(--pill);color:var(--pillt);font-size:11px;font-weight:700}.pill.soon{background:var(--warn);color:var(--warnt)}
button,.btn{display:inline-block;border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer;font-size:13px;font-family:inherit}.primary{background:var(--teal);color:#fff}.secondary,.sm{background:var(--sec);color:var(--head)}.danger{background:#a93636;color:#fff}.full{width:100%;margin-top:10px}.sm{padding:6px 9px}
.flash{padding:13px 16px;border-radius:9px;margin:0 0 14px;font-size:13px}.flash.success{background:var(--ok);color:var(--okt)}.flash.error{background:var(--err);color:var(--errt)}.flash.warning,.warnbox{background:var(--warn);color:var(--warnt)}.warnbox{border:1px solid #f1d69b55;border-radius:12px;padding:15px 18px;margin-bottom:18px;font-size:13px}
.empty{text-align:center;padding:30px;color:var(--muted)}label{display:block;font-size:12px;font-weight:700;margin:0 0 6px;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;font:14px inherit;color:var(--ink);background:var(--card);margin-bottom:14px}input:focus,select:focus,textarea:focus{outline:2px solid #168b8366}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.wide{grid-column:1/-1}.act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dg{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}dl{display:grid;grid-template-columns:150px 1fr;gap:10px;margin:0}dt{color:var(--muted);font-size:13px}dd{margin:0;font-size:13px;font-weight:600}
.flt{display:flex;gap:14px;align-items:end}.flt>div{flex:1}.login{max-width:430px;margin:6vh auto;padding:30px}.hint{background:var(--th);padding:12px;border-radius:8px;font-size:12px;color:var(--muted);margin-top:16px}.hint code{display:block}
.chk{display:flex;gap:9px;align-items:flex-start;background:var(--warn);color:var(--warnt);padding:12px;border-radius:8px;margin:12px 0;font-weight:600;font-size:13px;text-transform:none}.chk input{width:auto;margin:3px 0 0}
.tl{list-style:none;margin:16px 0 0;padding:0 0 0 8px}.tl li{display:flex;gap:14px;position:relative;padding-bottom:20px}.tl li:not(:last-child):before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}.dot{width:14px;height:14px;border-radius:50%;background:var(--teal);flex:0 0 14px;z-index:1;margin-top:3px}.tl p{font-size:12px;color:var(--muted);margin:3px 0}.tl code{display:block;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--code);padding:8px;border-radius:6px;margin-top:5px;font-size:12px}.tl summary{cursor:pointer;color:var(--lk);font-weight:600;font-size:12px}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.dg{grid-template-columns:1fr}.flt{display:block}.pagehead{flex-direction:column;align-items:flex-start}nav{order:3;flex-basis:100%}}
@media(max-width:560px){.fg{grid-template-columns:1fr}dl{grid-template-columns:1fr;gap:3px}dd{margin-bottom:8px}h1{font-size:24px}}
</style></head>
<body><div id="app"></div>
<script>
const K='scp_v11_db',R={admin:'Administrador',solicitante:'Solicitante',aprovador:'Aprovador',financeiro:'Responsável financeiro'};
let D,U=null,V=['dash'],M=[],RF={status:'',start:'',end:''};
function sha256(a){function r(v,n){return v>>>n|v<<32-n}var p=Math.pow,mw=p(2,32),res='',w=[],bl=a.length*8,h=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,ic={},i,j;for(var c=2;pc<64;c++)if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;h[pc]=p(c,.5)*mw|0;k[pc++]=p(c,1/3)*mw|0}a+='\x80';while(a.length%64-56)a+='\x00';for(i=0;i<a.length;i++){j=a.charCodeAt(i);w[i>>2]|=j<<(3-i)%4*8}w[w.length]=bl/mw|0;w[w.length]=bl;for(j=0;j<w.length;){var x=w.slice(j,j+=16),oh=h;h=h.slice(0,8);for(i=0;i<64;i++){var w15=x[i-15],w2=x[i-2],A=h[0],e=h[4],t1=h[7]+(r(e,6)^r(e,11)^r(e,25))+(e&h[5]^~e&h[6])+k[i]+(x[i]=i<16?x[i]:x[i-16]+(r(w15,7)^r(w15,18)^w15>>>3)+x[i-7]+(r(w2,17)^r(w2,19)^w2>>>10)|0),t2=(r(A,2)^r(A,13)^r(A,22))+(A&h[1]^A&h[2]^h[1]&h[2]);h=[t1+t2|0].concat(h);h[4]=h[4]+t1|0}for(i=0;i<8;i++)h[i]=h[i]+oh[i]|0}for(i=0;i<8;i++)for(j=3;j+1;j--){var b=h[i]>>j*8&255;res+=(b<16?0:'')+b.toString(16)}return res}
const H=(u,p)=>sha256(unescape(encodeURIComponent('scp$'+u+'$'+p)));
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,19),today=()=>now().slice(0,10);
const brl=c=>'R$ '+(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dbr=v=>v&&v.length>=10?v.slice(8,10)+'/'+v.slice(5,7)+'/'+v.slice(0,4):v||'';
const toC=v=>{let s=(v||'').replace(/R\$|\s/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Math.round(parseFloat(s)*100)};
const norm=s=>(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const usr=id=>D.users.find(u=>u.id==id)||{name:'—'};
const acc=id=>D.accounts.find(a=>a.id==id);
const OPEN=a=>!['Pago','Cancelado','Rejeitado'].includes(a.status);
function init(){D={users:[],accounts:[],decisions:[],payments:[],audit:[],seq:{}};[['admin','Administrador SCP','Admin@SCP2026!','admin'],['solicitante','Usuário Solicitante','Solicita@SCP2026!','solicitante'],['aprovador','Gestor Aprovador','Aprova@SCP2026!','aprovador'],['financeiro','Responsável Financeiro','Paga@SCP2026!','financeiro']].forEach(([u,n,p,r])=>D.users.push({id:nid('u'),username:u,name:n,hash:H(u,p),role:r,active:1,created_at:now()}));save()}
function nid(t){D.seq[t]=(D.seq[t]||0)+1;return D.seq[t]}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function load(){try{D=JSON.parse(localStorage.getItem(K))}catch(e){D=null}if(!D||!D.users)init()}
function aud(aid,action,o,n,reason){D.audit.push({id:nid('l'),account_id:aid,user_id:U.id,action,old:o??null,new:n??null,reason:reason||'',created_at:now()})}
function dups(a){const d=norm(a.supplier_doc),i=norm(a.invoice_ref),s=norm(a.supplier);return D.accounts.filter(x=>x.id!==a.id&&!['Rejeitado','Cancelado'].includes(x.status)&&d&&d===norm(x.supplier_doc)&&((i&&i===norm(x.invoice_ref))||(s===norm(x.supplier)&&a.amount_cents===x.amount_cents&&a.due_date===x.due_date)))}
function vis(a){return U.role==='admin'||(U.role==='solicitante'&&a.requester_id===U.id)||(U.role==='aprovador'&&a.approver_id===U.id)||(U.role==='financeiro'&&['Aprovado','Pago'].includes(a.status))}
const mine=()=>D.accounts.filter(vis).sort((a,b)=>a.due_date.localeCompare(b.due_date));
function flash(t,m){M.push([t,m])}
function go(...v){V=v;draw();scrollTo(0,0)}
function who(){U=U&&D.users.find(u=>u.id===U.id&&u.active)||null;return U}
function draw(){const l=who();let body='';if(!l){body=vLogin()}else{try{body=({dash:vDash,new:vNew,det:vDet,rep:vRep,usr:vUsr,aud:vAud,bak:vBak,txt:vTxt})[V[0]]()}catch(e){body='<section class="card"><h1>Ops!</h1><p>'+E(e.message)+'</p></section>'}}
const nav=l?`<nav><a onclick="go('dash')">Painel</a>${['solicitante','admin'].includes(U.role)?`<a onclick="go('new')">Nova conta</a>`:''}${['admin','financeiro','aprovador'].includes(U.role)?`<a onclick="go('rep')">Relatórios</a>`:''}${U.role==='admin'?`<a onclick="go('usr')">Usuários</a><a onclick="go('aud')">Auditoria</a><a onclick="go('bak')">Backup</a>`:''}</nav><div class="user">${E(U.name)}<small>${R[U.role]}</small><button class="linkbtn" onclick="U=null;go('dash')">Sair</button></div>`:'';
const fl=M.map(([t,m])=>`<div class="flash ${t}">${E(m)}</div>`).join('');M=[];
document.getElementById('app').innerHTML=`<header><div class="brand"><span class="mark">S</span><div><b>SCP</b><small>Sistema de Contas a Pagar</small></div></div>${nav}</header><main>${fl}${body}</main><footer>SCP · Protótipo acadêmico v1.1 · Pagamentos são realizados fora do sistema · Dados guardados apenas neste navegador</footer>`}
const head=(e,t,s,x='')=>`<div class="pagehead"><div><div class="eyebrow">${e}</div><h1>${t}</h1><p class="muted">${s}</p></div>${x}</div>`;
function vLogin(){return `<section class="login card"><div class="eyebrow">GESTÃO FINANCEIRA</div><h1>Entrar no SCP</h1><p class="muted">Acesse com seu usuário e senha.</p><form onsubmit="return F.login(this)"><label>Usuário</label><input name="u" required autofocus autocapitalize="off"><label>Senha</label><input name="p" type="password" required><button class="primary full">Entrar</button></form><div class="hint"><b>Usuários de demonstração</b><code>admin / Admin@SCP2026!</code><code>solicitante / Solicita@SCP2026!</code><code>aprovador / Aprova@SCP2026!</code><code>financeiro / Paga@SCP2026!</code>Dados fictícios apenas. Não use informações financeiras reais.</div></section>`}
function vDash(){const rows=mine(),t=today(),lim=new Date(Date.now()+7*864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const c=f=>rows.filter(f).length,ov=x=>OPEN(x)&&x.due_date<t;
const att=rows.filter(x=>x.status==='Aprovado'||(OPEN(x)&&x.due_date<=lim)).slice(0,8);
const st=[['Registros visíveis',rows.length],['Pendentes de aprovação',c(x=>x.status==='Pendente de aprovação')],['Aprovados',c(x=>x.status==='Aprovado')],['Aprovadas não pagas',c(x=>x.status==='Aprovado')],['Pagos',c(x=>x.status==='Pago')]].map(([a,b])=>`<div class="stat"><small>${a}</small><strong>${b}</strong></div>`).join('')+`<div class="stat w"><small>Vencidos</small><strong>${c(ov)}</strong></div><div class="stat s"><small>Vencem em até 7 dias</small><strong>${c(x=>OPEN(x)&&x.due_date>=t&&x.due_date<=lim)}</strong></div>`;
const tr=(x,al)=>`<tr><td>#${x.id}</td><td><b>${E(x.supplier)}</b><small>${E(x.description)}</small></td><td>${al?brl(x.amount_cents):E(x.invoice_ref)}</td><td>${al?dbr(x.due_date):brl(x.amount_cents)}</td><td>${al?(x.status==='Aprovado'?'<span class="pill">Aprovada · aguardando pagamento</span>':ov(x)?`<span class="overdue">Vencida · ${x.status}</span>`:`<span class="pill soon">Vence em breve · ${x.status}</span>`):dbr(x.due_date)}</td>${al?'':`<td><span class="pill">${x.status}</span>${ov(x)?' <small class="overdue">Vencida</small>':''}</td>`}<td><a onclick="go('det',${x.id})">Abrir →</a></td></tr>`;
return head('VISÃO GERAL','Painel de contas','Acompanhe solicitações, aprovações e vencimentos.',['solicitante','admin'].includes(U.role)?`<a class="btn primary" onclick="go('new')">+ Cadastrar conta</a>`:'')+`<div class="stats">${st}</div>
<section class="card"><h2>Alertas e ações necessárias</h2>${att.length?`<div class="tw"><table><thead><tr><th>ID</th><th>Fornecedor</th><th>Valor</th><th>Vencimento</th><th>Situação</th><th></th></tr></thead><tbody>${att.map(x=>tr(x,1)).join('')}</tbody></table></div>`:'<div class="empty">Nenhum alerta preventivo para os registros visíveis neste momento.</div>'}</section>
<section class="card"><h2>Contas recentes <span class="muted" style="font-weight:400;font-size:13px">· ${rows.length} registro(s)</span></h2>${rows.length?`<div class="tw"><table><thead><tr><th>ID</th><th>Fornecedor</th><th>Documento</th><th>Valor</th><th>Vencimento</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(x=>tr(x,0)).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma conta disponível para seu perfil.</div>'}</section>`}
const opt=a=>a.map(x=>`<option>${x}</option>`).join('');
function vNew(){if(!['solicitante','admin'].includes(U.role))throw Error('Acesso negado: seu perfil não permite essa operação.');
return head('LANÇAMENTO','Cadastrar conta','Após o envio, a conta ficará pendente de aprovação.')+`<form class="card fg" onsubmit="return F.new(this)"><div><label>Fornecedor *</label><input name="supplier" required></div><div><label>CNPJ/CPF do fornecedor *</label><input name="supplier_doc" required></div><div><label>Nota fiscal / referência *</label><input name="invoice_ref" required></div><div><label>Categoria *</label><select name="category" required><option value="">Selecione</option>${opt(['Aluguel','Água','Energia','Internet/Telefonia','Material','Serviços','Impostos','Outros'])}</select></div><div class="wide"><label>Descrição *</label><input name="description" required></div><div><label>Valor (R$) *</label><input name="amount" placeholder="1250,00" required inputmode="decimal"></div><div><label>Forma de pagamento *</label><select name="payment_method" required><option value="">Selecione</option>${opt(['Pix','Boleto','Transferência','Cartão','Dinheiro','Outro'])}</select></div><div><label>Data de emissão *</label><input type="date" name="issue_date" required></div><div><label>Data de vencimento *</label><input type="date" name="due_date" required></div><div class="wide"><label>Gestor responsável pela aprovação *</label><select name="approver_id" required><option value="">Selecione</option>${D.users.filter(u=>u.role==='aprovador'&&u.active).map(u=>`<option value="${u.id}">${E(u.name)}</option>`).join('')}</select></div><div class="wide act"><button class="primary">Salvar e enviar para aprovação</button><a class="btn secondary" onclick="go('dash')">Cancelar</a></div></form>`}
function vDet(){const a=acc(V[1]);if(!a||!vis(a))throw Error('Registro não encontrado ou acesso não autorizado.');
const d=dups(a),logs=D.audit.filter(l=>l.account_id===a.id),dec=D.decisions.filter(x=>x.account_id===a.id).reverse(),pay=D.payments.filter(x=>x.account_id===a.id).pop(),ov=OPEN(a)&&a.due_date<today();
const js=v=>v==null?'':JSON.stringify(v);
return head('DETALHES DO LANÇAMENTO','Conta #'+a.id,E(a.supplier)+' · '+E(a.invoice_ref),`<span class="pill" style="font-size:13px">${a.status}</span>`)+
(d.length?`<section class="warnbox"><b>Possível duplicidade identificada</b><p>Foram encontrados lançamentos semelhantes: ${d.map(x=>`<a onclick="go('det',${x.id})">#${x.id}</a>`).join(', ')}. Confira fornecedor, documento, referência, valor e vencimento antes de aprovar. O alerta não confirma fraude ou duplicidade definitiva.</p></section>`:'')+
`<div class="dg"><section class="card"><h2>Informações da conta</h2><dl><dt>Fornecedor</dt><dd>${E(a.supplier)}</dd><dt>Documento</dt><dd>${E(a.supplier_doc)}</dd><dt>Referência</dt><dd>${E(a.invoice_ref)}</dd><dt>Descrição</dt><dd>${E(a.description)}</dd><dt>Categoria</dt><dd>${E(a.category)}</dd><dt>Valor previsto</dt><dd>${brl(a.amount_cents)}</dd><dt>Emissão / vencimento</dt><dd>${dbr(a.issue_date)} / ${dbr(a.due_date)}${ov?' <span class="overdue">· VENCIDA</span>':''}</dd><dt>Forma</dt><dd>${E(a.payment_method)}</dd><dt>Solicitante</dt><dd>${E(usr(a.requester_id).name)}</dd><dt>Aprovador</dt><dd>${E(usr(a.approver_id).name)}</dd></dl></section><div>
${U.role==='aprovador'&&a.approver_id===U.id&&a.status==='Pendente de aprovação'?`<section class="card"><h2>Analisar solicitação</h2><form onsubmit="return false"><label>Justificativa (obrigatória para rejeitar)</label><textarea id="rs" rows="3"></textarea>${d.length?`<label class="chk"><input type="checkbox" id="cd"> Conferi os lançamentos semelhantes e confirmo que esta conta pode seguir para aprovação.</label>`:''}<div class="act"><button class="primary" onclick="F.dec(${a.id},'Aprovado')">Aprovar</button><button class="danger" onclick="F.dec(${a.id},'Rejeitado')">Rejeitar</button></div></form></section>`:''}
${U.role==='financeiro'&&a.status==='Aprovado'?`<section class="card"><h2>Confirmar pagamento</h2><p class="muted">Registre pagamento já realizado fora do SCP.</p><form onsubmit="return F.pay(this,${a.id})"><label>Valor pago (R$)</label><input name="amount" required placeholder="1250,00"><label>Data do pagamento</label><input type="date" name="paid_date" required><label>Comprovante / referência</label><input name="proof_ref" required><button class="primary full">Registrar pagamento</button></form></section>`:''}
${U.role==='admin'&&a.status!=='Cancelado'?`<section class="card"><h2>Cancelar conta</h2><form onsubmit="return F.cancel(this,${a.id})"><label>Justificativa</label><textarea name="reason" required rows="2"></textarea><button class="danger">Cancelar com registro de auditoria</button></form></section>`:''}
${pay?`<section class="card"><h2>Pagamento registrado</h2><p><b>${brl(pay.amount_cents)}</b> em ${dbr(pay.paid_date)}</p><p>Referência: ${E(pay.proof_ref)}</p><small class="muted">Registrado por ${E(usr(pay.user_id).name)}</small></section>`:''}</div></div>
<section class="card"><h2>Linha do tempo da despesa</h2><p class="muted">Registro cronológico das principais ações realizadas no SCP.</p>${logs.length?`<ol class="tl">${logs.map(l=>`<li><span class="dot"></span><div><b>${E(l.action.charAt(0)+l.action.slice(1).toLowerCase())}</b><p>${E(usr(l.user_id).name)} · ${l.created_at.replace('T',' ')}</p>${l.reason?`<small class="muted">Justificativa: ${E(l.reason)}</small>`:''}${l.new?`<details><summary>Detalhes do registro</summary><code>${E(js(l.new))}</code></details>`:''}</div></li>`).join('')}</ol>`:'<p class="muted">Ainda não há eventos registrados.</p>'}</section>
<section class="card"><h2>Histórico de decisões</h2>${dec.length?dec.map(x=>`<p><b>${x.decision}</b> · ${E(usr(x.user_id).name)} · ${x.created_at.replace('T',' ')}${x.reason?`<br><span class="muted">${E(x.reason)}</span>`:''}</p>`).join(''):'<p class="muted">Nenhuma decisão registrada.</p>'}</section><p><a onclick="go('dash')">← Voltar ao painel</a></p>`}
function repRows(){return mine().filter(a=>U.role!=='admin'||1).filter(a=>(!RF.status||a.status===RF.status)&&(!RF.start||a.due_date>=RF.start)&&(!RF.end||a.due_date<=RF.end))}
function vRep(){if(U.role==='solicitante')throw Error('Acesso negado: seu perfil não permite essa operação.');const r=repRows();
return head('ACOMPANHAMENTO','Relatórios','Os resultados respeitam o perfil do usuário.',`<button class="secondary" onclick="F.csv()">Exportar CSV</button>`)+`<form class="card flt" onsubmit="return F.rep(this)"><div><label>Status</label><select name="status"><option value="">Todos</option>${['Pendente de aprovação','Aprovado','Rejeitado','Pago','Cancelado'].map(s=>`<option ${RF.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Vencimento a partir de</label><input type="date" name="start" value="${RF.start}"></div><div><label>Vencimento até</label><input type="date" name="end" value="${RF.end}"></div><button class="primary" style="margin-bottom:14px">Filtrar</button></form><div class="stat" style="margin-bottom:18px;max-width:320px"><small>Total previsto dos registros filtrados</small><strong>${brl(r.reduce((s,x)=>s+x.amount_cents,0))}</strong></div><section class="card"><div class="tw"><table><thead><tr><th>ID</th><th>Fornecedor</th><th>Referência</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody>${r.map(a=>`<tr><td>#${a.id}</td><td>${E(a.supplier)}</td><td>${E(a.invoice_ref)}</td><td>${brl(a.amount_cents)}</td><td>${dbr(a.due_date)}</td><td>${a.status}</td></tr>`).join('')||'<tr><td colspan="6">Nenhum resultado.</td></tr>'}</tbody></table></div></section>`}
function vUsr(){return head('ADMINISTRAÇÃO','Usuários e perfis','Crie contas individuais. Não compartilhe credenciais.')+`<section class="card"><h2>Novo usuário</h2><form class="fg" onsubmit="return F.usr(this)"><div><label>Login</label><input name="username" required></div><div><label>Nome</label><input name="name" required></div><div><label>Senha (mínimo 10 caracteres)</label><input type="password" name="password" required minlength="10"></div><div><label>Perfil</label><select name="role">${Object.entries(R).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="wide"><button class="primary">Criar usuário</button></div></form></section><section class="card"><h2>Usuários cadastrados</h2><div class="tw"><table><thead><tr><th>Login</th><th>Nome</th><th>Perfil</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${D.users.map(u=>`<tr><td>${E(u.username)}</td><td>${E(u.name)}</td><td>${R[u.role]}</td><td>${u.active?'Ativo':'Inativo'}</td><td><button class="sm" onclick="F.tog(${u.id})">${u.active?'Desativar':'Ativar'}</button></td></tr>`).join('')}</tbody></table></div></section>`}
function vAud(){return head('RASTREABILIDADE','Registro de auditoria','Últimas 500 operações. Consulta exclusiva do administrador.')+`<section class="card"><div class="tw"><table><thead><tr><th>Data/hora</th><th>Usuário</th><th>Conta</th><th>Ação</th><th>Justificativa</th></tr></thead><tbody>${D.audit.slice(-500).reverse().map(l=>`<tr><td>${l.created_at.replace('T',' ')}</td><td>${E(usr(l.user_id).name)}</td><td>${l.account_id?'#'+l.account_id:'—'}</td><td>${E(l.action)}</td><td>${E(l.reason||'—')}</td></tr>`).join('')}</tbody></table></div></section>`}
function vBak(){return head('SEGURANÇA','Backup e restauração','Copie o texto abaixo e guarde em um arquivo seu. Para restaurar, cole um backup no segundo campo.')+`<section class="card"><h2>Backup atual</h2><textarea id="bk" rows="7" readonly onfocus="this.select()">${E(JSON.stringify(D))}</textarea><button class="primary" onclick="F.copy('bk')">Copiar backup</button></section><section class="card"><h2>Restaurar</h2><textarea id="rb" rows="5" placeholder="Cole aqui o backup"></textarea><div class="act"><button class="secondary" onclick="F.rest()">Restaurar backup</button><button class="danger" onclick="F.reset()">Apagar tudo e reiniciar demo</button></div></section>`}
function vTxt(){return head('EXPORTAÇÃO','Relatório CSV','Copie o conteúdo e cole em um arquivo .csv ou direto no Excel (separador ponto e vírgula).')+`<section class="card"><textarea id="bk" rows="12" readonly onfocus="this.select()">${E(V[1])}</textarea><div class="act"><button class="primary" onclick="F.copy('bk')">Copiar</button><a class="btn secondary" onclick="go('rep')">Voltar</a></div></section>`}
const F={
login(f){const d=new FormData(f),u=D.users.find(x=>x.username===d.get('u').trim());if(u&&u.active&&u.hash===H(u.username,d.get('p'))){U=u;go('dash')}else{flash('error','Usuário ou senha inválidos.');draw()}return false},
new(f){try{const d=Object.fromEntries(new FormData(f));for(const k in d)d[k]=d[k].trim();if(Object.values(d).some(v=>!v))throw Error('Preencha todos os campos obrigatórios.');const amt=toC(d.amount);if(!(amt>0))throw Error('O valor deve ser maior que zero.');if(d.due_date<d.issue_date)throw Error('O vencimento não pode ser anterior à emissão.');if(!D.users.some(u=>u.id==d.approver_id&&u.role==='aprovador'&&u.active))throw Error('Selecione um aprovador ativo.');
const a={id:nid('a'),supplier:d.supplier,supplier_doc:d.supplier_doc,invoice_ref:d.invoice_ref,description:d.description,category:d.category,amount_cents:amt,issue_date:d.issue_date,due_date:d.due_date,payment_method:d.payment_method,requester_id:U.id,approver_id:+d.approver_id,status:'Pendente de aprovação',created_at:now()};D.accounts.push(a);const m=dups(a);aud(a.id,'CADASTRO',null,{status:a.status,valor_centavos:amt,possiveis_duplicidades:m.map(x=>x.id)});save();
flash(m.length?'warning':'success',m.length?`ATENÇÃO: possível duplicidade com ${m.map(x=>'#'+x.id).join(', ')}. O lançamento foi mantido, mas precisa ser conferido antes da aprovação.`:`Conta #${a.id} cadastrada e enviada para aprovação.`);go('dash')}catch(e){flash('error',e.message);draw()}return false},
dec(id,x){const a=acc(id),r=document.getElementById('rs').value.trim();if(!a||a.approver_id!==U.id||a.status!=='Pendente de aprovação'){flash('error','Somente contas pendentes podem receber decisão.')}else if(x==='Rejeitado'&&!r){flash('error','A justificativa é obrigatória para rejeitar.')}else if(x==='Aprovado'&&dups(a).length&&!(document.getElementById('cd')||{}).checked){flash('warning','Atenção: existe possível lançamento semelhante. Confira os registros relacionados e marque a confirmação antes de aprovar.')}else{const o=a.status;a.status=x;D.decisions.push({id:nid('d'),account_id:id,user_id:U.id,decision:x,reason:r,created_at:now()});aud(id,'DECISÃO',{status:o},{status:x},r);save();flash('success','Conta '+x.toLowerCase()+' com sucesso.')}go('det',id)},
pay(f,id){const d=Object.fromEntries(new FormData(f)),a=acc(id),amt=toC(d.amount);if(!(amt>0)||!d.paid_date||!d.proof_ref.trim())flash('error','Informe valor, data e comprovante/referência.');else if(!a||a.status!=='Aprovado')flash('error','Pagamento bloqueado: somente contas aprovadas podem ser pagas.');else{D.payments.push({id:nid('p'),account_id:id,user_id:U.id,amount_cents:amt,paid_date:d.paid_date,proof_ref:d.proof_ref.trim(),created_at:now()});a.status='Pago';aud(id,'CONFIRMAÇÃO DE PAGAMENTO',{status:'Aprovado'},{status:'Pago',valor_pago_centavos:amt,data:d.paid_date,referencia:d.proof_ref.trim()});save();flash('success','Pagamento registrado. O SCP não executou transferência bancária.')}go('det',id);return false},
cancel(f,id){const r=new FormData(f).get('reason').trim(),a=acc(id);if(!r)flash('error','Justificativa obrigatória.');else if(!a||a.status==='Cancelado')flash('error','Conta não encontrada ou já cancelada.');else{const o=a.status;a.status='Cancelado';aud(id,'CANCELAMENTO',{status:o},{status:'Cancelado'},r);save();flash('success','Conta cancelada com histórico preservado.')}go('det',id);return false},
rep(f){RF=Object.fromEntries(new FormData(f));draw();return false},
csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';go('txt','\ufeff'+[['ID','Fornecedor','Documento','Descrição','Valor (centavos)','Vencimento','Status'].join(';')].concat(mine().map(a=>[a.id,q(a.supplier),q(a.invoice_ref),q(a.description),a.amount_cents,a.due_date,q(a.status)].join(';'))).join('\n'))},
usr(f){try{const d=Object.fromEntries(new FormData(f));d.username=d.username.trim();d.name=d.name.trim();if(!d.username||!d.name||d.password.length<10||!R[d.role])throw Error('Informe usuário, nome, perfil e senha com pelo menos 10 caracteres.');if(D.users.some(u=>u.username===d.username))throw Error('Esse nome de usuário já existe.');D.users.push({id:nid('u'),username:d.username,name:d.name,hash:H(d.username,d.password),role:d.role,active:1,created_at:now()});aud(null,'CRIAÇÃO DE USUÁRIO',null,{username:d.username,role:d.role});save();flash('success','Usuário criado.')}catch(e){flash('error',e.message)}go('usr');return false},
tog(id){const u=usr(id);if(id===U.id)flash('error','Não é permitido desativar o próprio usuário.');else{const n=u.active?0:1;aud(null,'ALTERAÇÃO DE USUÁRIO',{active:u.active},{active:n});u.active=n;save();flash('success','Situação do usuário atualizada.')}go('usr')},
copy(id){const t=document.getElementById(id);t.select();try{navigator.clipboard.writeText(t.value).catch(()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}},
rest(){try{const x=JSON.parse(document.getElementById('rb').value);if(!x.users||!x.accounts||!x.audit)throw 0;if(!confirm('Substituir todos os dados atuais pelo backup?'))return;D=x;save();U=null;flash('success','Backup restaurado. Entre novamente.');go('dash')}catch(e){flash('error','Backup inválido.');draw()}},
reset(){if(confirm('Apagar todos os dados deste navegador e voltar ao estado inicial?')){init();U=null;flash('success','Sistema reiniciado com os usuários de demonstração.');go('dash')}}};
load();draw();
</script></body></html>
