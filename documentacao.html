<script>
const DOCS=[{"id": "README", "t": "Visão geral", "md": "# SCP — Repositório do Projeto\n\nEstrutura organizada conforme os nomes fixos indicados pela disciplina.\n\n## Artefatos principais\n\n- `constituicao.md` — princípios (aguardam confirmação formal da equipe).\n- `especificacao.md` — contexto, usuários, escopo, requisitos EARS e critérios Dado/Quando/Então.\n- `plano.md` — arquitetura lógica, dados, riscos e decisões técnicas.\n- `tarefas.md` — backlog ordenado, dependências, rastreabilidade e log de IA.\n- `revisao_pares_checklist.md` — formulário para revisão real por outra equipe/monitoria.\n- `relatorio_validacao.md` — matriz requisito → critério → tarefa → status e testes.\n- `relatorio_final.md` — relatório preliminar a completar após o SPT e validação.\n- `adendo_diferenciais_v1_1.md` — proposta de requisitos adicionais RF-13 a RF-15, ainda sujeita à aprovação da equipe.\n- `SPT/SCP_Sistema_v1/` — protótipo web SCP v1.1, com instruções e roteiro de testes.\n\n## Estado honesto da entrega\n\nEsta entrega reúne a documentação e o protótipo local SCP v1.1. A implementação técnica das três melhorias não significa aprovação formal dos requisitos propostos. A revisão por pares e os testes de aceitação manuais continuam pendentes; não preencher como concluídos sem evidências.\n\n## Histórico\n\nUsar GitHub ou Google Drive com histórico de versões. Registrar autor, data e resumo das alterações. Manter versões aprovadas e não sobrescrever evidências de teste.\n\n## Atualização v1.1\n\nO protótipo recebeu alerta aprimorado de possíveis duplicidades, linha do tempo por despesa e painel preventivo de vencimentos. O adendo correspondente é uma proposta para deliberação da equipe.\n"}, {"id": "constituicao", "t": "Constituição", "md": "# Constituição do Projeto — Sistema de Contas a Pagar (SCP)\n\n**Versão:** 2.0 — 17/11/2026  \n**Status:** proposta consolidada para aprovação expressa da equipe.\n\n## 1. Problema e objetivo\n\nControles manuais ou dispersos de contas a pagar podem dificultar o acompanhamento de vencimentos, gerar erros de lançamento e aumentar o risco de pagamentos duplicados. O SCP pretende centralizar o cadastro, a análise, a aprovação e a confirmação de pagamentos, mantendo histórico verificável.\n\n## 2. Princípios inegociáveis\n\n> **Atenção:** estes princípios foram consolidados a partir do material original da equipe. A equipe deve confirmar formalmente esta versão antes de tratá-la como aprovada.\n\n- **P1 — Simplicidade:** o sistema deve ter linguagem clara, campos compreensíveis e fluxo objetivo.\n- **P2 — Acesso autorizado:** cada usuário só pode consultar e executar ações compatíveis com seu perfil, responsabilidade e alçada.\n- **P3 — Rastreabilidade:** operações relevantes devem registrar usuário autenticado, data, horário, ação e conta; alterações devem preservar informação anterior e nova, quando aplicável.\n- **P4 — Integridade:** registros financeiros e seu histórico não podem ser apagados ou alterados silenciosamente. Correções devem ocorrer por fluxo autorizado, justificado e auditável.\n- **P5 — Segregação e confirmação:** cadastro, aprovação e confirmação de pagamento são etapas distintas. Uma conta só pode ser considerada paga após confirmação por usuário autorizado, com referência ou comprovante.\n\n## 3. Limites\n\n- O SCP apoia o controle administrativo; não realiza transferência bancária nesta versão.\n- A confirmação no SCP ocorre depois do pagamento feito fora do sistema.\n- A ferramenta escolhida não pode enfraquecer os princípios acima.\n- Forms/Sheets isoladamente não garantem autorização por registro nem logs protegidos; uma camada de aplicação e testes de segurança serão necessários se essa plataforma for escolhida.\n\n## 4. Critério geral de sucesso\n\nO projeto será considerado concluído quando o SPT atender aos critérios de aceitação aprovados, os testes forem executados pela equipe, as falhas forem tratadas ou registradas e houver evidências verificáveis.\n"}, {"id": "especificacao", "t": "Especificação", "md": "# Especificação de Requisitos — Sistema de Contas a Pagar (SCP)\n\n**Versão:** 2.0 — 17/11/2026  \n**Status:** versão revisada; depende de aprovação da equipe e revisão por pares/monitoria.\n\n## 1. Contexto e problema\n\nA gestão manual ou dispersa de obrigações financeiras dificulta localizar informações, acompanhar vencimentos e verificar quem cadastrou, aprovou ou confirmou uma conta. O SCP centraliza essas informações e organiza o fluxo, sem executar pagamentos bancários.\n\n## 2. Usuários\n\n- **Solicitante/contador:** cadastra contas, acompanha solicitações e corrige dados enquanto o fluxo permitir.\n- **Gestor/aprovador:** analisa contas atribuídas à sua alçada, aprova ou rejeita e registra justificativa quando exigida.\n- **Responsável pela confirmação:** registra pagamento realizado externamente, com valor, data e comprovante/referência.\n- **Administrador:** gerencia usuários, perfis e parâmetros; suas ações também são auditadas.\n\nUma mesma pessoa pode acumular funções somente se a equipe definir isso e se não contrariar a regra de segregação adotada. As alçadas e incompatibilidades ainda precisam ser aprovadas.\n\n## 3. Escopo incluído\n\nCadastro e consulta de contas; validação de campos; identificador único; alerta de possível duplicidade; encaminhamento para aprovação; aprovação/rejeição; confirmação manual de pagamento; controle de status; histórico/auditoria; alertas de vencimento; relatórios básicos.\n\n## 4. Fora do escopo\n\nContas a receber; execução automática de transferências; integração bancária em tempo real; conciliação bancária automática; importação automática de OFX. Não se presume integração bancária porque o documento original mencionou essa possibilidade sem definir interface, dados ou autorização.\n\n## 5. Requisitos funcionais em formato EARS\n\n- **RF-01 — Cadastro:** Quando um solicitante autorizado enviar uma conta, o sistema deverá validar os campos obrigatórios e registrar os dados válidos.\n- **RF-02 — Identificador:** Quando uma conta válida for registrada, o sistema deverá atribuir um identificador único.\n- **RF-03 — Duplicidade:** Quando os dados de uma conta coincidirem com critérios de possível duplicidade, o sistema deverá exibir um alerta para análise humana, sem excluir automaticamente o registro.\n- **RF-04 — Consulta:** Quando um usuário consultar contas, o sistema deverá retornar somente registros compatíveis com suas permissões e responsabilidades.\n- **RF-05 — Aprovação:** Quando o gestor autorizado aprovar uma conta pendente, o sistema deverá registrar a decisão, o usuário autenticado e a data/hora.\n- **RF-06 — Rejeição:** Quando o gestor autorizado rejeitar uma conta, o sistema deverá exigir justificativa e registrar a decisão e a data/hora.\n- **RF-07 — Confirmação de pagamento:** Quando um usuário autorizado confirmar o pagamento de uma conta aprovada, o sistema deverá registrar valor pago, data e comprovante ou referência e atualizar o status para Pago.\n- **RF-08 — Bloqueio de pagamento:** Se uma conta não estiver aprovada, o sistema deverá impedir sua confirmação como paga.\n- **RF-09 — Status/vencimento:** Enquanto uma conta não estiver paga ou cancelada e sua data de vencimento tiver passado, o sistema deverá sinalizá-la como vencida sem apagar o status principal do fluxo.\n- **RF-10 — Auditoria:** Quando ocorrer criação, edição permitida, aprovação, rejeição, confirmação, cancelamento ou estorno, o sistema deverá registrar usuário, data/hora, ação e dados relevantes; em alterações, deverá preservar valores anterior e novo.\n- **RF-11 — Relatórios:** Quando um usuário autorizado solicitar relatório, o sistema deverá apresentar totais e listagens conforme filtros disponíveis, respeitando suas permissões.\n- **RF-12 — Cancelamento/estorno:** Quando um usuário com permissão específica solicitar cancelamento ou estorno, o sistema deverá exigir justificativa e preservar o registro original e seu histórico.\n\n## 6. Requisitos não funcionais\n\n- **RNF-01 Segurança:** autenticação e autorização devem ser verificadas no servidor/camada de aplicação em cada operação; ocultar abas ou botões não é controle suficiente.\n- **RNF-02 Integridade:** IDs devem ser únicos; usuários operacionais não podem apagar ou sobrescrever registros financeiros e logs.\n- **RNF-03 Auditabilidade:** logs devem ser protegidos contra edição comum e consultáveis apenas por usuários autorizados.\n- **RNF-04 Usabilidade:** mensagens de erro e instruções devem ser claras e em português.\n- **RNF-05 Recuperação:** deve existir procedimento documentado de backup e restauração, testado antes da entrega final.\n- **RNF-06 Desempenho:** limites de volume e tempo de resposta serão definidos após escolha da plataforma e dimensionamento do protótipo.\n\n## 7. Regras de negócio\n\n- **RN-01:** conta válida recém-cadastrada inicia como `Pendente de aprovação`.\n- **RN-02:** somente gestor autorizado para aquela conta pode aprovar/rejeitar.\n- **RN-03:** rejeição exige justificativa; eventual correção e reenvio preservam a decisão anterior.\n- **RN-04:** somente conta aprovada pode ter pagamento confirmado.\n- **RN-05:** aprovação não significa pagamento realizado.\n- **RN-06:** `Vencida` é indicador calculado e pode coexistir com o status principal.\n- **RN-07:** cancelamento/estorno exige permissão e justificativa e não apaga o lançamento original.\n- **RN-08:** alerta de duplicidade solicita análise humana; não é exclusão automática.\n\n## 8. Critérios de aceitação — Dado/Quando/Então\n\n- **CA-01 (RF-01/RF-02):** Dado que o solicitante autenticado preencheu todos os campos obrigatórios com dados válidos, quando enviar a conta, então o sistema registra a conta com ID único e status `Pendente de aprovação`.\n- **CA-02 (RF-01):** Dado que falta um campo obrigatório, quando o solicitante tentar enviar, então o sistema impede o cadastro e identifica o campo a corrigir.\n- **CA-03 (RF-04/RNF-01):** Dado que o usuário não possui permissão para uma conta, quando tentar consultá-la ou alterá-la, então o sistema nega a operação e não revela os dados protegidos.\n- **CA-04 (RF-05/RF-08):** Dado que uma conta está pendente ou rejeitada, quando alguém tentar confirmar seu pagamento, então o sistema bloqueia a confirmação.\n- **CA-05 (RF-05/RF-06):** Dado que um gestor autorizado decide aprovar ou rejeitar, quando confirmar a decisão, então o sistema registra usuário, data/hora e decisão; se rejeitar, exige justificativa.\n- **CA-06 (RF-07):** Dado que uma conta está aprovada, quando um usuário autorizado registrar pagamento com valor, data e comprovante/referência, então o sistema registra a confirmação e altera o status para `Pago`.\n- **CA-07 (RF-10):** Dado que ocorre uma operação auditável, quando ela for concluída, então o log registra usuário, data/hora, ação e conta; se houver alteração, registra os valores anterior e novo.\n- **CA-08 (RF-03):** Dado que uma conta coincide com os critérios de possível duplicidade, quando for cadastrada, então o sistema exibe alerta e permite análise autorizada sem apagar automaticamente nenhum registro.\n- **CA-09 (RF-11):** Dado que um usuário autorizado seleciona filtros de relatório, quando solicitar a consulta, então o relatório apresenta os registros e totais correspondentes e respeita as permissões.\n- **CA-10 (RF-12/RNF-02):** Dado que uma conta foi paga ou precisa ser cancelada/estornada, quando um usuário tentar apagá-la diretamente, então o sistema impede a exclusão; correção só ocorre por fluxo autorizado e auditável.\n- **CA-11 (RF-09):** Dado que a data atual passou do vencimento e a conta não foi paga nem cancelada, quando a lista for exibida, então o sistema apresenta o indicador `Vencida` sem substituir o status principal.\n- **CA-12 (RNF-05):** Dado que existe procedimento de backup configurado, quando a equipe executar restauração em ambiente de teste, então os dados restaurados correspondem ao conjunto salvo, conforme evidência registrada.\n\n## 9. Pontos que a equipe precisa decidir antes da implementação\n\n1. Alçadas/limites de aprovação por valor, categoria ou centro de custo.\n2. Uma ou mais aprovações por conta e regra de substituição do gestor.\n3. Se solicitante pode confirmar pagamento ou se essa função é sempre separada.\n4. Prazo e canal dos alertas de vencimento.\n5. Campos exatos do fornecedor/documento fiscal e critérios de duplicidade.\n6. Prazo de retenção de logs e política de backup.\n7. Volume esperado, número de usuários e restrições da plataforma.\n8. Se a equipe aprova a regra de correção por cancelamento/estorno em vez de exclusão direta.\n\n## 10. Dependências e restrições\n\nA implementação depende da aprovação desta especificação, das decisões acima e da revisão por pares/monitoria. A integração bancária e o pagamento automático não fazem parte da versão atual.\n"}, {"id": "plano", "t": "Plano", "md": "# Plano — Sistema de Contas a Pagar (SCP)\n\n**Versão:** 2.0 — 17/11/2026  \n**Status:** proposta técnica; decisões pendentes indicadas abaixo.\n\n## 1. Caminho de implementação\n\nA escolha é livre conforme orientação da disciplina. A proposta inicial da equipe é Google Forms + Google Sheets, com Google Apps Script como camada de aplicação. Essa escolha só será confirmada após protótipo técnico demonstrar autenticação, autorização por conta, integridade dos registros e auditoria. Se não demonstrar, a equipe deverá escolher outra plataforma sem alterar os requisitos aprovados.\n\n## 2. Componentes lógicos\n\n1. Interface de cadastro/consulta.\n2. Serviço de validação e identificação única.\n3. Controle de identidade, perfis, responsabilidades e alçadas.\n4. Fluxo de aprovação/rejeição.\n5. Registro de confirmação de pagamento.\n6. Repositório de contas, decisões, pagamentos e logs.\n7. Relatórios e alertas.\n\n## 3. Modelo mínimo de dados\n\n- **Contas:** id, fornecedor, documento do fornecedor, referência/NF, descrição, categoria, valor, emissão, vencimento, forma de pagamento, solicitante, gestor responsável, status, timestamps.\n- **Aprovações:** id, conta_id, gestor_id, decisão, justificativa, data_hora.\n- **Pagamentos:** id, conta_id, valor_pago, data_pagamento, responsável_id, comprovante/referência.\n- **Logs:** id, conta_id, usuário_id, ação, data_hora, campo, valor_anterior, valor_novo, justificativa quando aplicável.\n- **Usuários/perfis:** identificador autenticado, perfil, responsabilidades, alçadas e situação ativa.\n\nOs campos definitivos, identificadores e política de retenção precisam ser aprovados pela equipe. Não usar nome/e-mail digitado livremente como autenticação.\n\n## 4. Status\n\n`Pendente de aprovação`, `Aprovado`, `Rejeitado`, `Pago`, `Cancelado`. `Vencida` será indicador calculado, não status que apaga o estado principal. A interface pode exibir os dois, por exemplo: `Aprovado · Vencida`.\n\n## 5. Riscos e respostas\n\n| Risco | Resposta planejada |\n|---|---|\n| Acesso indevido a dados | Autenticação e autorização no servidor em cada ação; teste com perfis distintos |\n| Alteração/exclusão indevida | Logs protegidos; correção por fluxo auditável; teste de integridade |\n| Pagamento sem aprovação | Regra no servidor bloqueando transição; teste negativo |\n| Duplicidade | Alerta por combinação de campos e revisão humana |\n| Duas edições simultâneas | Controle de concorrência/versão do registro; definir solução técnica após escolha da plataforma |\n| Perda de dados | Backup e restauração testados |\n| Limites da plataforma | Protótipo técnico antes de assumir a ferramenta |\n| Requisitos indefinidos | Resolver decisões da seção 9 da especificação antes de implementar tarefas dependentes |\n\n## 6. Decisões pendentes\n\nAlçadas; múltiplos aprovadores; separação do responsável pelo pagamento; prazos de alerta; retenção; volume; plataforma definitiva; critérios de duplicidade. A equipe deve registrar decisão, responsável e data antes de iniciar tarefas dependentes.\n\n## 7. Critério para escolha da ferramenta\n\nA plataforma será aceita se permitir: autenticar usuários; validar autorização por registro e operação; manter histórico não editável por usuários comuns; impedir pagamento sem aprovação; preservar dados originais; produzir evidências de teste; e ser viável no prazo e recursos da equipe.\n"}, {"id": "tarefas", "t": "Tarefas", "md": "# Tarefas — Sistema de Contas a Pagar (SCP)\n\n**Versão:** 2.1 — 17/11/2026  \n**Status:** backlog proposto; tarefas não devem ser marcadas como concluídas sem evidência.\n\n## 1. Backlog rastreável\n\n| ID | Tarefa | Requisitos/CA relacionados | Dependência | Responsável | Status inicial |\n|---|---|---|---|---|---|\n| T-01 | Aprovar constituição e especificação; resolver decisões pendentes | P1–P5; RF-01 a RF-12; CA-01 a CA-12 | — | Equipe | Pendente |\n| T-02 | Fazer revisão por pares e monitoria; preencher checklist e revisar spec | Todos | T-01 | Equipe + outra equipe/monitoria | Pendente |\n| T-03 | Comparar plataformas e provar autenticação/autorização e auditoria em protótipo | RNF-01 a RNF-03 | T-01, T-02 | Equipe com sugestões da IA | Pendente |\n| T-04 | Definir modelo de dados e identificadores | RF-01, RF-02, RF-10; CA-01, CA-07 | T-03 | Equipe/implementador | Pendente |\n| T-05 | Implementar cadastro e validação de campos | RF-01; CA-01, CA-02 | T-04 | Implementador | Pendente |\n| T-06 | Implementar detecção/alerta de duplicidade | RF-03; CA-08 | T-05 | Implementador | Pendente |\n| T-07 | Implementar autenticação e autorização por registro/operação | RF-04, RNF-01; CA-03 | T-03, T-04 | Implementador | Pendente |\n| T-08 | Implementar aprovação e rejeição com justificativa | RF-05, RF-06; CA-05 | T-05, T-07 | Implementador | Pendente |\n| T-09 | Implementar bloqueio de pagamento sem aprovação | RF-08; CA-04 | T-08 | Implementador | Pendente |\n| T-10 | Implementar confirmação manual de pagamento | RF-07; CA-06 | T-09 | Implementador | Pendente |\n| T-11 | Implementar auditoria protegida e correção/cancelamento/estorno | RF-10, RF-12; CA-07, CA-10 | T-04, T-07 | Implementador | Pendente |\n| T-12 | Implementar indicador de vencimento | RF-09; CA-11 | T-05, T-10 | Implementador | Pendente |\n| T-13 | Implementar relatórios com filtros e permissões | RF-11; CA-09 | T-07, T-08, T-10 | Implementador | Pendente |\n| T-14 | Implementar e testar backup/restauração | RNF-05; CA-12 | T-04 | Implementador/equipe | Pendente |\n| T-15 | Preparar pacote do SPT, instruções de execução e evidências | Todos | T-05 a T-14 | Equipe | Pendente |\n| T-16 | Executar validação manual, registrar falhas e retestar após correção | CA-01 a CA-12 | T-15 | Equipe, sem IA | Pendente |\n| T-17 | Consolidar relatório final e repositório | Entregáveis da disciplina | T-02, T-15, T-16 | Equipe | Pendente |\n| T-18 | Revisar e aprovar critérios de detecção de possíveis duplicidades; validar bloqueio de aprovação sem conferência | RF-13/CA-13 propostos | T-01, T-06 | Equipe + implementador | Pendente |\n| T-19 | Revisar eventos e permissões da linha do tempo; validar sequência cronológica | RF-14/CA-14 propostos | T-07, T-11 | Equipe + implementador | Pendente |\n| T-20 | Revisar horizonte de vencimento e indicadores do painel preventivo | RF-15/CA-15 propostos | T-12 | Equipe + implementador | Pendente |\n\n## 2. Ordem de execução\n\nA sequência preferencial é T-01 → T-02 → T-03 → T-04 → T-05 → T-06/T-07 → T-08 → T-09 → T-10 → T-11/T-12/T-13/T-14 → T-15 → T-16 → T-17. As tarefas T-18 a T-20 dependem da revisão do adendo v1.1 e podem ser executadas em paralelo após a aprovação dos critérios pela equipe. Tarefas paralelas só podem ocorrer quando suas dependências estiverem satisfeitas.\n\n## 3. Registro do uso de IA\n\n| Data | Assistente | Tarefa | Material gerado/sugerido pela IA | Revisão/correção humana | Responsável | Situação |\n|---|---|---|---|---|---|---|\n| 17/11/2026 | ChatGPT (OpenAI) | Revisão documental e organização de artefatos | Sugestões de estrutura, redação, requisitos, critérios, plano, tarefas e matriz de rastreabilidade | Equipe deve revisar, aprovar, corrigir e registrar suas decisões antes de usar como versão oficial | Equipe | Em revisão |\n| 17/11/2026 | ChatGPT (OpenAI) | Evolução técnica do protótipo v1.1 | Implementação inicial de alerta de duplicidade com confirmação, linha do tempo e painel preventivo; adendo e novos casos de teste | Equipe deve revisar código, deliberar sobre os requisitos propostos e executar os testes manuais CT-14 a CT-16 | Equipe | Aguardando revisão e validação |\n\n**Regra:** atualizar esta tabela durante a implementação, indicando claramente o que a IA gerou e o que uma pessoa revisou, corrigiu ou aprovou. Não é necessário arquivar prompts.\n"}, {"id": "adendo", "t": "Adendo v1.1", "md": "# Adendo proposto à especificação — SCP v1.1\n\n**Status:** proposta técnica gerada durante a evolução do protótipo; depende de revisão e aprovação explícita da equipe antes de integrar a especificação oficial.\n\n## Objetivo\nAcrescentar três diferenciais ao protótipo: prevenção de possíveis pagamentos duplicados, transparência por linha do tempo e gestão preventiva de vencimentos.\n\n## Requisitos propostos\n\n### RF-13 — Análise de possíveis duplicidades\nO sistema deverá comparar os dados de uma nova conta com lançamentos existentes e sinalizar possíveis semelhanças. Na versão técnica atual, a comparação considera documento do fornecedor e referência; também considera coincidência de documento, fornecedor, valor e vencimento. O alerta não deverá excluir automaticamente o lançamento nem declarar fraude. Se houver possível duplicidade, o aprovador deverá confirmar que conferiu os registros relacionados antes de aprovar.\n\n**Critério CA-13 (Dado/Quando/Então):**\n- Dado que exista uma conta ativa com documento e referência coincidentes;\n- Quando um usuário cadastrar outra conta com esses dados;\n- Então o SCP deverá apresentar alerta e identificar o registro relacionado, mantendo ambos para análise.\n- Dado que a conta sinalizada esteja pendente;\n- Quando o aprovador tentar aprová-la sem confirmar a conferência;\n- Então o SCP deverá impedir a aprovação e explicar a necessidade de conferência.\n\n### RF-14 — Linha do tempo da despesa\nO sistema deverá apresentar, na tela de detalhes da conta, os principais eventos registrados: cadastro, decisão de aprovação/rejeição, confirmação manual de pagamento e cancelamento, com usuário e data/hora.\n\n**Critério CA-14 (Dado/Quando/Então):**\n- Dado que uma conta tenha passado por cadastro, decisão e confirmação de pagamento;\n- Quando um usuário autorizado abrir os detalhes da conta;\n- Então o SCP deverá exibir os eventos em ordem cronológica, com responsável e data/hora.\n\n### RF-15 — Painel preventivo de vencimentos\nO sistema deverá apresentar indicadores de contas vencidas, contas com vencimento entre a data atual e os próximos sete dias e contas aprovadas ainda sem registro de pagamento. A consulta deverá respeitar as permissões do perfil.\n\n**Critério CA-15 (Dado/Quando/Então):**\n- Dado que existam contas vencidas, próximas do vencimento e aprovadas não pagas;\n- Quando um usuário autorizado acessar o painel;\n- Então o SCP deverá apresentar os indicadores e a lista de atenção correspondentes aos registros que esse usuário pode visualizar.\n\n## Premissas que a equipe precisa deliberar\n1. Aprovar ou ajustar os campos usados na comparação de duplicidade.\n2. Definir se o horizonte de sete dias é adequado ou se deve ser configurável.\n3. Definir quais eventos e detalhes podem ser exibidos a cada perfil.\n4. Confirmar a redação dos critérios de aceitação e incluir os requisitos aprovados na especificação oficial.\n\n## Implementação técnica\nO protótipo SCP v1.1 inclui uma primeira implementação dessas três propostas. A implementação não equivale à aprovação formal dos requisitos nem à validação dos critérios. Os testes CT-14, CT-15 e CT-16 permanecem pendentes até execução manual pela equipe.\n"}, {"id": "apoio", "t": "Apoio a formulários", "md": "# Apoio — Formulário e Estrutura de Dados\n\nDocumento complementar; a especificação principal prevalece em caso de conflito.\n\n## Cadastro proposto\n\n**Fornecedor:** nome/razão social, CPF/CNPJ quando aplicável, contato.  \n**Documento da obrigação:** número da NF/documento, descrição, categoria.  \n**Financeiro:** valor, data de emissão, vencimento, forma de pagamento e referência/código de barras quando aplicável.  \n**Controle:** usuário autenticado (capturado pela plataforma, não digitado livremente), data/hora automática, ID gerado pelo sistema.\n\n## Abas/entidades lógicas propostas\n\n1. Contas\n2. Aprovações\n3. Pagamentos\n4. Logs\n5. Usuários e permissões\n\nA separação física em abas não é, por si só, controle de segurança. A camada de aplicação deve aplicar autorização em cada leitura e escrita.\n"}, {"id": "revisao", "t": "Revisão por pares", "md": "# Revisão por Pares — Checklist de Qualidade\n\n**Projeto:** Sistema de Contas a Pagar (SCP)  \n**Versão da especificação avaliada:** 2.0 — 17/11/2026  \n**Equipe revisora:** ____________________  **Data:** __________  **Monitoria:** __________\n\n> Este checklist está preparado para a atividade, mas NÃO foi preenchido por outra equipe nem validado pela monitoria. Não marcar como realizado sem a revisão real.\n\n| Verificação | Sim | Não | N/A | Comentários / ajuste necessário |\n|---|:---:|:---:|:---:|---|\n| O problema está descrito de forma clara e objetiva? | ☐ | ☐ | ☐ | |\n| Usuários e responsabilidades estão identificados? | ☐ | ☐ | ☐ | |\n| Escopo e fora de escopo estão explícitos? | ☐ | ☐ | ☐ | |\n| Cada requisito funcional descreve comportamento verificável? | ☐ | ☐ | ☐ | |\n| Os requisitos seguem estrutura EARS adequada? | ☐ | ☐ | ☐ | |\n| Os critérios seguem Dado/Quando/Então e são testáveis? | ☐ | ☐ | ☐ | |\n| Cada critério está ligado a requisito(s)? | ☐ | ☐ | ☐ | |\n| Regras de negócio não se contradizem? | ☐ | ☐ | ☐ | |\n| Permissões e exceções estão suficientemente claras? | ☐ | ☐ | ☐ | |\n| Dados de entrada, saída e validações estão identificados? | ☐ | ☐ | ☐ | |\n| Ambiguidades, termos vagos e decisões em aberto foram apontados? | ☐ | ☐ | ☐ | |\n| Requisitos são viáveis na ferramenta proposta? | ☐ | ☐ | ☐ | |\n| Há critérios para segurança, integridade e auditoria? | ☐ | ☐ | ☐ | |\n| Requisitos e critérios podem ser associados a tarefas e testes? | ☐ | ☐ | ☐ | |\n\n## Registro da revisão\n\n- Principais problemas encontrados: __________________________________________\n- Sugestões da outra equipe: _________________________________________________\n- Orientações da monitoria: _________________________________________________\n- Alterações realizadas na especificação: ____________________________________\n- Itens não resolvidos e justificativa: ______________________________________\n- Aprovação da equipe responsável pela especificação: ________________________\n"}, {"id": "validacao", "t": "Relatório de validação", "md": "# Relatório de Validação — Sistema de Contas a Pagar (SCP)\n\n**Versão:** 1.1 — 17/11/2026  \n**Status:** plano/matriz preparada; execução ainda não realizada.\n\n## 1. Objetivo e método\n\nA equipe deverá executar manualmente cada cenário contra o SPT entregue, comparar o resultado observado com o critério de aceitação e anexar evidência. A IA não deve executar nem declarar aprovados os testes de aceitação, pois a orientação da disciplina atribui essa validação à equipe.\n\n## 2. Matriz requisito → critério → tarefa → status\n\n| Requisito | Critério | Tarefa | Teste relacionado | Status inicial | Evidência/observação |\n|---|---|---|---|---|---|\n| RF-01, RF-02 | CA-01 | T-04, T-05 | CT-01 | Pendente | A preencher pela equipe |\n| RF-01 | CA-02 | T-05 | CT-02 | Pendente | A preencher pela equipe |\n| RF-04, RNF-01 | CA-03 | T-07 | CT-03 | Pendente | A preencher pela equipe |\n| RF-05, RF-08 | CA-04 | T-08, T-09 | CT-04 | Pendente | A preencher pela equipe |\n| RF-05, RF-06 | CA-05 | T-08 | CT-05, CT-06 | Pendente | A preencher pela equipe |\n| RF-07 | CA-06 | T-10 | CT-07 | Pendente | A preencher pela equipe |\n| RF-10 | CA-07 | T-11 | CT-08 | Pendente | A preencher pela equipe |\n| RF-03 | CA-08 | T-06 | CT-09 | Pendente | A preencher pela equipe |\n| RF-11 | CA-09 | T-13 | CT-10 | Pendente | A preencher pela equipe |\n| RF-12, RNF-02 | CA-10 | T-11 | CT-11 | Pendente | A preencher pela equipe |\n| RF-09 | CA-11 | T-12 | CT-12 | Pendente | A preencher pela equipe |\n| RNF-05 | CA-12 | T-14 | CT-12 | Pendente | A preencher pela equipe |\n| RF-13 (proposto) | CA-13 | T-18 | CT-14 | Pendente | Depende de aprovação do adendo |\n| RF-14 (proposto) | CA-14 | T-19 | CT-15 | Pendente | Depende de aprovação do adendo |\n| RF-15 (proposto) | CA-15 | T-20 | CT-16 | Pendente | Depende de aprovação do adendo |\n\n## 3. Casos de teste propostos\n\n| ID | Procedimento manual | Resultado esperado | Status |\n|---|---|---|---|\n| CT-01 | Cadastrar conta válida | ID único e status Pendente de aprovação | Pendente |\n| CT-02 | Enviar cadastro sem campo obrigatório | Envio bloqueado e campo indicado | Pendente |\n| CT-03 | Tentar acessar conta de outra responsabilidade com perfil sem permissão | Acesso negado sem revelar dados | Pendente |\n| CT-04 | Tentar confirmar conta pendente ou rejeitada | Confirmação bloqueada | Pendente |\n| CT-05 | Gestor autorizado aprova conta | Decisão, usuário e data/hora registrados | Pendente |\n| CT-06 | Gestor rejeita sem justificativa e depois com justificativa | Primeira tentativa bloqueada; segunda registrada com justificativa | Pendente |\n| CT-07 | Confirmar conta aprovada com valor, data e referência | Status Pago e confirmação registrada | Pendente |\n| CT-08 | Criar/alterar registro e consultar trilha | Log completo; alteração guarda antes/depois | Pendente |\n| CT-09 | Cadastrar possível duplicidade | Alerta exibido; nenhum registro apagado automaticamente | Pendente |\n| CT-10 | Gerar relatório com filtros | Dados e totais coerentes com registros e permissões | Pendente |\n| CT-11 | Tentar apagar pagamento/conta diretamente | Exclusão bloqueada; fluxo auditável exigido | Pendente |\n| CT-12 | Simular data posterior ao vencimento | Indicador Vencida sem substituir status principal | Pendente |\n| CT-12 | Fazer backup e restaurar em ambiente de teste | Dados recuperados e evidência documentada | Pendente |\n| CT-13 | Executar cadastro, decisão e pagamento; consultar auditoria administrativa | Eventos principais aparecem na auditoria | Pendente |\n| CT-14 | Cadastrar possível duplicidade e tentar aprovar sem confirmar conferência | Alerta aparece; aprovação exige confirmação explícita | Pendente |\n| CT-15 | Abrir detalhes após cadastro, decisão e pagamento | Linha do tempo mostra ações, usuários e datas/horários | Pendente |\n| CT-16 | Consultar painel com contas vencidas, próximas do vencimento e aprovadas não pagas | Indicadores e lista correspondem às permissões do perfil | Pendente |\n\n## 4. Registro de execução por caso\n\nPara cada CT, a equipe deverá registrar: data/hora, responsável, ambiente/versão, dados de teste, resultado observado, resultado esperado, aprovado/reprovado, evidência (arquivo/captura) e defeito/retorno à especificação, se houver.\n\n## 5. Conclusão\n\nO protótipo v1.1 foi atualizado com as três melhorias descritas no adendo proposto. Os requisitos RF-13 a RF-15 ainda dependem de aprovação da equipe. Não há conclusão de validação nesta versão. Todos os casos permanecem **Pendente** até execução manual pela equipe e inclusão de evidências. A aprovação final não pode ser inferida da existência desta matriz.\n"}, {"id": "final", "t": "Relatório final", "md": "# Relatório Final — Sistema de Contas a Pagar (SCP)\n\n**Versão de trabalho:** 1.0 — 17/11/2026  \n**Status:** relatório preliminar; atualizar após implementação, revisão por pares e validação.\n\n## 1. Introdução\n\nO SCP foi proposto para organizar o cadastro, a aprovação e o acompanhamento de obrigações financeiras, reduzindo falhas associadas a controles manuais ou dispersos.\n\n## 2. Método de desenvolvimento\n\nO processo segue as etapas da disciplina: aprovação do tema; constituição; especificação; revisão por pares; planejamento e decomposição; implementação; validação; entrega final. A equipe decide princípios, requisitos e critérios. A IA pode apoiar redação, planejamento, decomposição e implementação tarefa a tarefa. A validação de aceitação é executada pela equipe, sem apoio da IA.\n\n## 3. Decisões documentadas\n\nA versão proposta separa cadastro, aprovação e confirmação; não realiza transferências bancárias; trata duplicidade como alerta para análise; preserva histórico financeiro; e exige autorização por perfil/responsabilidade. A plataforma final permanece sujeita a prova técnica de segurança e integridade.\n\n## 4. Uso responsável de IA\n\nFoi utilizado ChatGPT (OpenAI) como apoio à revisão e estruturação documental. A IA sugeriu redação e organização de requisitos, critérios, plano, tarefas e matriz. A equipe deve revisar, corrigir e aprovar o conteúdo e registrar as contribuições humanas em `tarefas.md`. A IA não aprova princípios/requisitos em nome da equipe nem valida critérios de aceitação.\n\n## 5. Resultados comprovados nesta versão\n\nForam consolidados artefatos documentais padronizados e uma matriz de rastreabilidade preparada. Não há evidência apresentada nesta versão de SPT funcional concluído, revisão por pares realizada, aprovação de monitoria/professora ou testes executados. Portanto, não se afirma redução efetiva de erros, atrasos ou duplicidades.\n\n## 6. Pendências para conclusão\n\n- Aprovação formal do tema e da constituição/especificação.\n- Revisão por pares e monitoria, com checklist preenchido e especificação atualizada.\n- Decisões de negócio em aberto na especificação.\n- Escolha e prova técnica da plataforma.\n- Implementação de todas as tarefas e entrega do SPT.\n- Execução manual dos testes pela equipe, com evidências.\n- Atualização deste relatório com resultados reais e aprendizados.\n\n## 7. Conclusão\n\nO SCP possui uma base documental revisada para orientar as próximas etapas. A conclusão acadêmica e técnica dependerá da aprovação das decisões pendentes, da implementação do SPT e da validação comprovada pela equipe.\n"}, {"id": "sistema", "t": "Sistema: leia-me", "md": "# SCP — Protótipo funcional v1.1\n\nAplicação web local para demonstrar o fluxo de contas a pagar definido na especificação do projeto. Esta versão acrescenta três melhorias de demonstração: prevenção de possíveis duplicidades, linha do tempo da despesa e painel preventivo de vencimentos.\n\n## Funcionalidades\n- Login com senha armazenada por hash.\n- Perfis: administrador, solicitante, aprovador e financeiro.\n- Cadastro com validação e ID sequencial único.\n- **Prevenção de possíveis duplicidades:** compara documento do fornecedor e referência; também considera fornecedor, valor e vencimento. O alerta é um indício para conferência, não uma confirmação automática de fraude ou duplicidade.\n- **Confirmação antes da aprovação:** quando há registros semelhantes, o aprovador precisa abrir os relacionados e marcar que conferiu antes de aprovar. A rejeição continua disponível sem essa confirmação.\n- Visibilidade de registros conforme perfil e atribuição.\n- Aprovação/rejeição com registro de decisão; rejeição exige justificativa.\n- Bloqueio de pagamento sem aprovação.\n- Confirmação manual com valor, data e referência.\n- **Linha do tempo por despesa:** reúne cadastro, decisão, pagamento e cancelamento, com usuário e data/hora registrados.\n- **Painel preventivo:** mostra contas vencidas, vencimentos nos próximos 7 dias e contas aprovadas ainda não pagas, respeitando a visibilidade de cada perfil.\n- Cancelamento administrativo justificado, sem apagar o lançamento.\n- Relatórios filtrados e exportação CSV.\n- Auditoria e backup do banco SQLite.\n\n## Execução\nNo Windows, execute `INICIAR.bat`. Acesse `http://127.0.0.1:5000`.\n\n## Usuários de demonstração\n- `admin` / `Admin@SCP2026!`\n- `solicitante` / `Solicita@SCP2026!`\n- `aprovador` / `Aprova@SCP2026!`\n- `financeiro` / `Paga@SCP2026!`\n\nTroque as senhas antes de qualquer uso que não seja demonstração.\n\n## Atualização da v1.0 para v1.1 sem perder os registros\n1. Feche a janela preta do SCP usando Ctrl+C.\n2. Faça uma cópia de segurança do arquivo `scp.db` que fica dentro da pasta antiga `SCP_Sistema_v1`.\n3. Extraia esta versão em uma pasta nova.\n4. Se quiser manter os lançamentos e usuários anteriores, copie o `scp.db` da pasta antiga para a pasta nova `SCP_Sistema_v1`, substituindo apenas se tiver certeza de que fez a cópia de segurança.\n5. Abra `INICIAR.bat` na pasta nova. A estrutura do banco desta atualização é compatível com a base da v1.0; não há migração de tabelas nesta versão.\n\nSe preferir começar os testes do zero, não copie o banco antigo.\n\n## Segurança e limites\nEste é um protótipo local para avaliação acadêmica. Não foi submetido a teste de invasão, revisão independente ou implantação multiusuário. Não publicar na internet nem usar dados financeiros reais. A auditoria não é inviolável contra acesso direto ao arquivo SQLite ou à máquina. Para uso compartilhado, configurar segredo aleatório persistente, HTTPS, backups externos, política de acesso ao sistema operacional e revisão de segurança.\n\n## Relação com a especificação\nA v1.1 amplia a demonstração dos controles de duplicidade, rastreabilidade e vencimento. O relatório de validação continua pendente até a equipe executar e registrar os testes manuais. Os testes automatizados de apoio não substituem a validação manual exigida pela disciplina.\n\n## Decisões provisórias adotadas\n- O solicitante não aprova nem confirma pagamento.\n- O aprovador é atribuído no cadastro e só decide contas atribuídas a ele.\n- O financeiro só vê contas aprovadas/pagas e só confirma contas aprovadas.\n- O administrador gerencia usuários, consulta tudo e cancela com justificativa; não aprova nem confirma pagamentos.\n- Não há limites monetários ou múltiplas aprovações nesta versão.\nEstas são premissas técnicas para o protótipo, não decisões oficiais da equipe.\n"}, {"id": "alter", "t": "Sistema: alterações v1.1", "md": "SCP — ALTERAÇÕES DA VERSÃO 1.1\n\n1. PREVENÇÃO DE POSSÍVEIS DUPLICIDADES\n- Compara documento do fornecedor e referência da conta.\n- Também sinaliza fornecedor, documento, valor e vencimento coincidentes.\n- Exibe os registros relacionados na tela de detalhes.\n- Exige que o aprovador marque a confirmação antes de aprovar uma conta sinalizada.\n- Não apaga nem bloqueia o cadastro; a decisão continua humana.\n\n2. LINHA DO TEMPO\n- Exibe cronologicamente eventos de cadastro, decisão, confirmação de pagamento e cancelamento.\n- Mostra usuário e data/hora do evento.\n- Os eventos aparecem apenas para quem já tem autorização para visualizar a conta.\n\n3. PAINEL PREVENTIVO\n- Indicador de contas vencidas.\n- Indicador de contas com vencimento nos próximos 7 dias.\n- Indicador de contas aprovadas que ainda aguardam registro de pagamento.\n- Lista de alertas respeitando as permissões do perfil.\n\nOBSERVAÇÃO\nOs testes manuais CT-13 a CT-15 estão pendentes. A equipe deve executá-los e registrar evidências. A IA não declara os critérios validados.\n"}, {"id": "decis", "t": "Sistema: decisões pendentes", "md": "# Decisões que a equipe ainda precisa aprovar\n\nA equipe aprovou a estrutura do projeto, mas a especificação lista decisões de negócio que precisam de registro formal antes de considerar o produto definitivo.\n\n1. Alçadas/limites de aprovação por valor, categoria ou centro de custo.\n2. Uma ou mais aprovações por conta e regra de substituição do gestor.\n3. Confirmação de pagamento sempre separada do solicitante/aprovador?\n4. Prazo e canal dos alertas de vencimento.\n5. Campos definitivos de fornecedor/documento e critérios de duplicidade.\n6. Prazo de retenção dos logs e política de backup.\n7. Volume esperado e número de usuários.\n8. Política de correção, cancelamento e estorno.\n\nO protótipo adota premissas provisórias descritas no README. A equipe deve registrar decisão, responsável e data. Não interpretar as premissas como aprovação formal.\n\n## Premissas técnicas adicionadas na v1.1 (ainda sujeitas à aprovação da equipe)\n9. Alerta de possível duplicidade: compara documento do fornecedor com referência; também sinaliza mesmo documento, fornecedor, valor e vencimento. O alerta não bloqueia o cadastro, mas exige confirmação do aprovador antes de aprovar.\n10. Painel preventivo: considera como “vencimento próximo” o intervalo de hoje até os próximos 7 dias.\n11. Linha do tempo: apresenta os eventos de auditoria associados à despesa para qualquer usuário que já tenha permissão de visualizar aquela despesa.\n\nA equipe deve revisar se esses critérios atendem ao processo real que pretende representar e registrar eventual alteração na especificação.\n"}, {"id": "roteiro", "t": "Sistema: roteiro de testes", "md": "# Roteiro de testes práticos — SCP v1.1\n\n**Importante:** a equipe executa manualmente e registra evidências. Os testes automatizados auxiliares não substituem a validação manual da disciplina. Todos os dados devem ser fictícios.\n\n| ID | Critério | Passos | Resultado esperado | Status |\n|---|---|---|---|---|\n| CT-01 | CA-01 | Login solicitante; cadastrar conta completa | ID gerado e status Pendente de aprovação | Pendente |\n| CT-02 | CA-02 | Tentar enviar formulário sem campo obrigatório | Navegador/sistema impede envio ou informa campo | Pendente |\n| CT-03 | CA-03 | Tentar abrir URL de conta de outro solicitante | Acesso negado/404, sem revelar dados | Pendente |\n| CT-04 | CA-04 | Tentar registrar pagamento sem aprovação | Pagamento não é registrado | Pendente |\n| CT-05 | CA-05 | Aprovador aprova uma conta; tenta rejeitar outra sem justificativa | Aprovação registrada; rejeição sem justificativa é impedida | Pendente |\n| CT-06 | CA-06 | Financeiro registra pagamento de conta aprovada com valor, data e referência | Status Pago e dados do pagamento visíveis | Pendente |\n| CT-07 | CA-07 | Fazer cadastro, aprovação e pagamento; consultar auditoria como admin | Usuário, horário, ação e conta aparecem | Pendente |\n| CT-08 | CA-08 | Cadastrar conta com mesmo fornecedor/documento/referência | Alerta aparece e registro permanece | Pendente |\n| CT-09 | CA-09 | Filtrar relatório por status/período | Listagem e total correspondem ao filtro | Pendente |\n| CT-10 | CA-10 | Tentar apagar conta; cancelar sem justificativa | Não há exclusão direta; cancelamento exige justificativa | Pendente |\n| CT-11 | CA-11 | Cadastrar conta vencida e não pagar | Indicador Vencida aparece sem substituir status | Pendente |\n| CT-12 | CA-12 | Gerar backup; restaurar em ambiente separado; comparar registros | Dados restaurados correspondem ao backup | Pendente |\n| CT-13 | Diferencial 1 | Cadastrar duas contas com mesmo documento e referência; abrir a segunda como aprovador | SCP alerta, mostra a conta relacionada e exige confirmação antes da aprovação | Pendente |\n| CT-14 | Diferencial 2 | Abrir detalhes de uma conta após cadastro, decisão e pagamento | Linha do tempo mostra as ações, usuários e datas/horários | Pendente |\n| CT-15 | Diferencial 3 | Consultar painel com contas vencidas, vencendo em até 7 dias e aprovadas não pagas | Indicadores e lista de alertas correspondem aos registros visíveis ao perfil | Pendente |\n\n## Dados fictícios sugeridos\n- Conecta Telecom Ltda. — documento `12.345.678/0001-90`, referência `NF-001`, valor R$ 299,90, vencimento 25/11/2026.\n- Para duplicidade, cadastrar novamente os mesmos dados (inclusive documento e referência).\n- Para vencimento próximo, usar uma data entre hoje e os próximos 7 dias. Para vencida, usar uma data anterior a hoje.\n\n## Folha de evidências\nPara cada teste, preencher: data/hora, integrante responsável, usuário/perfil usado, passos executados, resultado observado, resultado esperado, status (Aprovado/Reprovado/Bloqueado), captura de tela e defeito aberto.\n"}];
const E=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=s=>E(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g,'<i>$1</i>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function md(t){const L=t.replace(/\r/g,'').split('\n'),o=[];let i=0;
while(i<L.length){let l=L[i],m;
if(/^```/.test(l)){let c=[];i++;while(i<L.length&&!/^```/.test(L[i]))c.push(L[i++]);i++;o.push('<pre>'+E(c.join('\n'))+'</pre>');continue}
if(m=l.match(/^(#{1,4})\s+(.*)/)){o.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`);i++;continue}
if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){o.push('<hr>');i++;continue}
if(/^\|/.test(l)){let r=[];while(i<L.length&&/^\|/.test(L[i]))r.push(L[i++]);const c=x=>x.replace(/^\||\|\s*$/g,'').split('|').map(s=>s.trim());const hd=c(r[0]),bd=r.slice(2).map(c);o.push('<div class="tw"><table><thead><tr>'+hd.map(x=>`<th>${inl(x)}</th>`).join('')+'</tr></thead><tbody>'+bd.map(x=>'<tr>'+x.map(y=>`<td>${inl(y)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>');continue}
if(/^\s*([-*]|\d+\.)\s/.test(l)){const ord=/^\s*\d+\./.test(l);let it=[];while(i<L.length&&(/^\s*([-*]|\d+\.)\s/.test(L[i])||(/^\s+\S/.test(L[i])&&it.length))){if(/^\s*([-*]|\d+\.)\s/.test(L[i]))it.push(L[i].replace(/^\s*([-*]|\d+\.)\s+/,''));else it[it.length-1]+=' '+L[i].trim();i++}o.push((ord?'<ol>':'<ul>')+it.map(x=>'<li>'+inl(x.replace(/^\[ \]/,'☐').replace(/^\[x\]/i,'☑'))+'</li>').join('')+(ord?'</ol>':'</ul>'));continue}
if(!l.trim()){i++;continue}
let p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|```|\||\s*([-*]|\d+\.)\s)/.test(L[i]))p.push(L[i++]);o.push('<p>'+p.map(inl).join('<br>')+'</p>')}
return o.join('')}
function show(id){const d=DOCS.find(x=>x.id===id)||DOCS[0];document.getElementById('a').innerHTML=md(d.md);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.i===d.id));try{history.replaceState(null,'','#'+d.id)}catch(e){}scrollTo(0,0)}
document.getElementById('n').innerHTML=DOCS.map(d=>`<button data-i="${d.id}" onclick="show('${d.id}')">${d.t}</button>`).join('');
show(location.hash.slice(1));
</script></body></html>
